global:
  scrape_interval: 15s
scrape_configs:
  - job_name: restaurant-app
    static_configs: [{targets: ['app:3000']}]
  - job_name: postgres
    static_configs: [{targets: ['postgres_exporter:9187']}]
  - job_name: nginx
    static_configs: [{targets: ['nginx_exporter:9113']}]
  - job_name: prometheus
    static_configs: [{targets: ['localhost:9090']}]
